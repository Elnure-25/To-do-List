
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <script src="/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-white flex justify-center items-center min-h-screen p-5">

    <div class="border shadow-teal-300 shadow-md max-w-2xl w-full p-6 rounded-lg">
        <h1 class="text-4xl font-mono font-extrabold py-3 bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-blue-500">
            ✨ TODO-List
        </h1>
        <div class="flex mb-6 group">
            <input
                id="taskInput"
                type="text"
                placeholder="Add a new task..."
                class="flex-1 px-4 py-3 rounded-l-lg bg-gray-100 border border-gray-300 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all duration-300"
            >
            <button
                id="addTaskBtn"
                class="px-5 rounded-r-lg bg-gradient-to-r from-purple-500 to-blue-500 text-white font-medium hover:shadow-lg transition-all duration-300"
            >
                Add
            </button>
        </div>
        <div id="clearButtonContainer"></div>
        <div id="taskList" class="space-y-3 mb-6">
        </div>
        <div class="p-4 rounded-lg bg-gradient-to-r from-gray-100 to-gray-200 border border-gray-300">
            <div class="flex justify-between text-sm">
                <div class="text-center">
                    <div id="pendingCount" class="text-2xl font-bold text-pink-500">0</div>
                    <div class="text-gray-500">Pending</div>
                </div>
                <div class="text-center">
                    <div id="completedCount" class="text-2xl font-bold text-blue-500">0</div>
                    <div class="text-gray-500">Completed</div>
                </div>
                <div class="text-center">
                    <div id="totalCount" class="text-2xl font-bold text-purple-500">0</div>
                    <div class="text-gray-500">Total</div>
                </div>

            </div>

        </div>

    </div>
</body>
</html>
